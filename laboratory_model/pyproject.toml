[project]
name = "laboratory-model"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    # The seed file is YAML (the same shape as labcode's env/boundary documents). uvicorn's
    # `standard` extra happens to pull PyYAML in as well, but this module imports it directly,
    # so it is declared directly.
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
