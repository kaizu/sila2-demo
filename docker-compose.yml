  environment:
    - PYTHONUNBUFFERED=1
    - SILA_SERVER_TYPE=AutomatedThermalCyclerServer
  command: ["python", "-m", "automated_thermal_cycler_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose", "--laboratory-status-url", "http://laboratory_status:8001"]

services:
  laboratory_status:
    build:
      context: ./laboratory_status
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1

  sila2-server-1:
    <<: *microplate-centrifuge-server
    ports:
      - "50052:50052"
    environment:
      - SILA_SERVER_NAME=Agilent-Microplate-Centrifuge

  sila2-server-2:
    <<: *plateloc-server
    ports:
      - "50053:50052"
    environment:
      - SILA_SERVER_NAME=Agilent-PlateLoc

  sila2-server-3:
    <<: *plate-seal-remover-server
    ports:
      - "50054:50052"
    environment:
      - SILA_SERVER_NAME=Azenta-Automated-Plate-Seal-Remover

  sila2-server-4:
    <<: *thermal-cycler-server
    ports:
      - "50055:50052"
    environment:
      - SILA_SERVER_NAME=ThermoFisher-Thermal-Cycler

  sila2-server-5:
    <<: *sila2-server
    ports:
      - "50056:50052"
    environment:
      - SILA_SERVER_NAME=Tecan-Fluent

  trolley-arm-server-1:
    <<: *trolley-arm-server
    ports:
      - "50057:50052"
    environment:
      - SILA_SERVER_NAME=Trolley-Arm-Server

  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    depends_on:
      - laboratory_status
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LABORATORY_STATUS_URL=http://laboratory_status:8001
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
