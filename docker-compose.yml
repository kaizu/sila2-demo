# Shared per-instrument definitions. NOTE: these anchors deliberately carry NO
# `environment:` key. A service that sets `environment:` REPLACES the anchor's list
# wholesale -- YAML merge keys (`<<:`) merge mappings but never deep-merge lists -- so
# every variable a container needs is listed on the service itself below. Splitting them
# between anchor and service silently drops the anchor's half.
x-sila2-server: &sila2-server
  build:
    context: .
    dockerfile: servers/station_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "station_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-trolley-arm-server: &trolley-arm-server
  build:
    context: .
    dockerfile: servers/trolley_arm_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "trolley_arm_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-microplate-centrifuge-server: &microplate-centrifuge-server
  build:
    context: .
    dockerfile: servers/microplate_centrifuge_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "microplate_centrifuge_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-plateloc-server: &plateloc-server
  build:
    context: .
    dockerfile: servers/plateloc_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "plateloc_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-plate-seal-remover-server: &plate-seal-remover-server
  build:
    context: .
    dockerfile: servers/automated_plate_seal_remover_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "automated_plate_seal_remover_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

x-thermal-cycler-server: &thermal-cycler-server
  build:
    context: .
    dockerfile: servers/automated_thermal_cycler_server/Dockerfile
    args:
      DURATIONS_FILE: ${DURATIONS_FILE:-command_durations.yaml}
  depends_on:
    - laboratory-model
  command: ["python", "-m", "automated_thermal_cycler_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose"]

services:
  laboratory-model:
    build:
      context: ./laboratory_model
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      # The seed describes the whole world at t=0: which devices exist, which spots each has,
      # each device's resting state, and where anything already sits. Mounted read-only, and
      # reread by `POST /reseed` -- so editing it between runs takes effect without a rebuild.
      - LABORATORY_MODEL_SEED_FILE=/app/config/seed.yaml
    volumes:
      - ./config/laboratory_model.seed.yaml:/app/config/seed.yaml:ro

  # Each service lists its environment in full (see the note on the anchors above): the
  # server type and the laboratory-model wiring as well as the instance name, because setting
  # `environment:` here discards whatever the anchor declared. PYTHONUNBUFFERED is also set by
  # every Dockerfile; it is repeated here so the compose file shows the complete runtime
  # environment.
  #
  # LABORATORY_MODEL_LOCATION is the single location each instrument acts on -- for the
  # trolley arm, the spot an item occupies while being carried. These two used to be
  # `--laboratory-model-*` options on the command line; the environment was always where the
  # servers read them from, so passing them directly is what lets each `__main__.py` stay
  # pure generator output.
  sila2-server-1:
    <<: *microplate-centrifuge-server
    ports:
      - "50052:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=MicroplateCentrifugeServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=centrifuge.deck
      - SILA_SERVER_NAME=Agilent-Microplate-Centrifuge

  sila2-server-2:
    <<: *plateloc-server
    ports:
      - "50053:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=PlateLocServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=plateloc.stage
      - SILA_SERVER_NAME=Agilent-PlateLoc

  sila2-server-3:
    <<: *plate-seal-remover-server
    ports:
      - "50054:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=AutomatedPlateSealRemoverServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=seal-remover.stage
      - SILA_SERVER_NAME=Azenta-Automated-Plate-Seal-Remover

  sila2-server-4:
    <<: *thermal-cycler-server
    ports:
      - "50055:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=AutomatedThermalCyclerServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=thermal-cycler.block
      - SILA_SERVER_NAME=ThermoFisher-Thermal-Cycler

  sila2-server-5:
    <<: *sila2-server
    ports:
      - "50056:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=StationServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=station.slot1
      - SILA_SERVER_NAME=Tecan-Fluent

  trolley-arm-server-1:
    <<: *trolley-arm-server
    ports:
      - "50057:50052"
    environment:
      - PYTHONUNBUFFERED=1
      - SILA_SERVER_TYPE=TrolleyArmServer
      - LABORATORY_MODEL_URL=http://laboratory-model:8001
      - LABORATORY_MODEL_LOCATION=trolley-arm.gripper
      - SILA_SERVER_NAME=Trolley-Arm-Server
