x-sila2-server: &sila2-server
  build:
    context: ./servers/station_server
    dockerfile: Dockerfile
  depends_on:
    - laboratory_status
  environment:
    - PYTHONUNBUFFERED=1
    - SILA_SERVER_TYPE=StationServer
  command: ["python", "-m", "station_server", "--ip-address", "0.0.0.0", "--port", "50052", "--insecure", "--verbose", "--laboratory-status-url", "http://laboratory_status:8001"]

