# How long each mock command takes, for the whole lab in one file.
#
# THIS IS THE DEFAULT PROFILE AND IT IS DELIBERATELY EMPTY: with no command listed, no command
# waits at all. The file exists rather than being absent so that "the lab runs as fast as it
# can" reads as a decision rather than as something nobody got round to writing.
#
# Why empty is the right default: a mock's wait is only worth having when something is meant to
# observe it. Nothing in `samples/` observes a Status transition mid-command, and the sample run
# is dominated by SiLA2 connection and discovery, so a token wait per command bought nothing.
#
# For a lab that behaves at instrument speed -- long enough for a polling client to observe a
# dispatch -> running -> completed transition -- build with the other profile:
#
#     DURATIONS_FILE=command_durations.realistic.yaml docker compose build
#     docker compose up -d --force-recreate
#
# Each server's own section is sliced out of the selected file at image build time (see
# `tools/slice_durations.py` and the builder stage in each server's Dockerfile), so a server
# image carries only its own numbers. Changing durations therefore needs a rebuild, not just a
# restart.
#
# Rules:
#   * A command that is not listed waits for nothing. Note the consequence: its Running window
#     collapses, so a polling client cannot observe the Status transition. That is fine here --
#     this profile wants exactly that -- but it is why `command_durations.realistic.yaml` must
#     list every command that waits, and why `tools/tests/test_command_durations.py` checks it
#     against the implementations.
#   * A device that is not listed has no timed commands at all.
#   * Durations are seconds and may be fractional.
#   * Each command's value is a mapping rather than a bare number so that a future jitter
#     setting is a pure addition (`{ duration: 3, jitter: 0.15 }`) rather than a format change.
#     Device-level settings would likewise go beside `commands:`.
#
# See `command_durations.realistic.yaml` for the format in use, and `docs/TIMING.md` for the
# whole picture.

devices: {}
