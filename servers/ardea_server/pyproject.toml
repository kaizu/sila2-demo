[project]
name = "ardea-server"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "sila2",
    "typer",
    # The shared laboratory-model HTTP client, installed from ./laboratory_client by this
    # server's Dockerfile before the server package itself (so pip resolves it locally and
    # never looks for a `laboratory-client` release online).
    "laboratory-client",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ardea_server*"]

[tool.setuptools.package-data]
"ardea_server.generated" = [
    "*/*.sila.xml",
    "*/*.proto",
]
